name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (if any)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-save; fi

      - name: Syntax check both bundles
        run: |
          node --check index.js
          node --check client.js

      - name: Validate manifest
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.dsh?.bundle?.patch) throw new Error('package.json must declare dsh.bundle.patch');
            if (!p.name || !p.version) throw new Error('package.json must declare name and version');
            if (!p.repository?.url) throw new Error('package.json must declare repository.url');
            console.log('manifest OK:', p.name, '@', p.version);
            console.log('dsh.bundle.patch =', p.dsh.bundle.patch);
          "

      - name: Pack the bundle
        run: |
          mkdir -p ./dist
          npm pack --pack-destination ./dist
          echo "Packed bundle:"
          ls -la dist/

      - name: Determine version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          body: |
            ## ${{ github.ref_name }}

            Release of **dsh-session-booth**.

            ### Install

            ```bash
            plugin_manager install_bundle <url-to-tgz>
            ```

            Or use DSH's plugin manager to discover and install it from the marketplace.
          files: |
            dist/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
